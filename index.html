<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flick Score — 7 v 7</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #eceae4;
    font-family: 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; z-index: 10;
    color: #2b2b2b;
    font-size: 16px;
    font-weight: bold;
  }
  .side-score { display: flex; align-items: center; gap: 6px; }
  .side-score.active { color: #2f6fed; }
  .turn-arrow { opacity: 0; }
  .side-score.active .turn-arrow { opacity: 1; }
  #newGameBtn {
    background: #444; color: #fff; border: none;
    padding: 8px 16px; border-radius: 20px; font-size: 14px;
    cursor: pointer;
  }
  #banner {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(255,255,255,0.95); padding: 24px 32px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: center;
    display: none; z-index: 20;
  }
  #banner button {
    margin-top: 12px; background: #2f6fed; color: #fff; border: none;
    padding: 10px 20px; border-radius: 20px; font-size: 16px; cursor: pointer;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">
  <div class="side-score" id="p2Row"><span class="turn-arrow">▶</span> P2 <span id="p2Score">0</span></div>
  <button id="newGameBtn">New Game</button>
  <div class="side-score" id="p1Row"><span class="turn-arrow">▶</span> P1 <span id="p1Score">0</span></div>
</div>
<div id="banner">
  <div id="bannerText">Round over!</div>
  <button id="restartBtn">Play Again</button>
</div>
<canvas id="game"></canvas>

<script>
// Reference names/values pulled from Izzat's floor mockup layout
const NAME_POOL = [
  { name: "BRUNO", value: 8 },
  { name: "HAALAND", value: 9 },
  { name: "MALONE", value: 16 },
  { name: "AHGRI", value: 3 },
  { name: "BRORO", value: 18 },
  { name: "SAKA", value: 11 },
  { name: "ODEGAARD", value: 12 },
  { name: "RASHFORD", value: 7 },
  { name: "FODEN", value: 14 },
  { name: "KANE", value: 20 },
];
const TARGETS_PER_SIDE = 7;
const MAX_TURNS_PER_SIDE = 7;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const p1ScoreEl = document.getElementById('p1Score');
const p2ScoreEl = document.getElementById('p2Score');
const p1Row = document.getElementById('p1Row');
const p2Row = document.getElementById('p2Row');
const banner = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');

let W, H;
/** Resize canvas to fill the viewport; layout constants below derive off W/H each frame. */
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const HUD_HEIGHT = 60;
const FRICTION = 0.985;
const BALL_RADIUS = 10;
const TARGET_W = 64;
const TARGET_H = 64;
const MAX_PULL = 140;
const POWER_SCALE = 0.16;

/** Half-height zones: p2 owns the top half, p1 owns the bottom half, midline splits them. */
function midY() { return HUD_HEIGHT + (H - HUD_HEIGHT) / 2; }

let p1, p2, turn, ball, dragging, dragCurrent, gameOver, particles;

/** Scatter TARGETS_PER_SIDE named point-value cards inside a side's half, avoiding overlap. */
function spawnTargetsFor(zoneTop, zoneBottom) {
  const pool = [...NAME_POOL];
  const list = [];
  let attempts = 0;
  while (list.length < TARGETS_PER_SIDE && attempts < 500) {
    attempts++;
    const idx = Math.floor(Math.random() * pool.length);
    const candidate = pool[idx];
    const x = TARGET_W/2 + Math.random() * (W - TARGET_W);
    const y = zoneTop + TARGET_H/2 + Math.random() * (zoneBottom - zoneTop - TARGET_H);
    const overlaps = list.some(t => Math.abs(t.x - x) < TARGET_W * 0.9 && Math.abs(t.y - y) < TARGET_H * 0.9);
    if (overlaps) continue;
    list.push({ x, y, w: TARGET_W, h: TARGET_H, name: candidate.name, value: candidate.value, alive: true });
    pool.splice(idx, 1);
  }
  return list;
}

/** Reset the shared ball to whichever side's launch position is currently active. */
function resetBall() {
  const y = turn === 'p1' ? H - 50 : HUD_HEIGHT + 50;
  ball = { x: W / 2, y, vx: 0, vy: 0, moving: false };
}

/** Start a brand new 7-v-7 round: fresh targets both sides, scores/turns reset, ball placed for P1. */
function newGame() {
  const mid = midY();
  p1 = { targets: spawnTargetsFor(mid, H), score: 0, turnsUsed: 0 };
  p2 = { targets: spawnTargetsFor(HUD_HEIGHT, mid), score: 0, turnsUsed: 0 };
  turn = 'p1';
  gameOver = false;
  particles = [];
  p1ScoreEl.textContent = p1.score;
  p2ScoreEl.textContent = p2.score;
  updateTurnIndicator();
  banner.style.display = 'none';
  resetBall();
}

function updateTurnIndicator() {
  p1Row.classList.toggle('active', turn === 'p1');
  p2Row.classList.toggle('active', turn === 'p2');
}

document.getElementById('newGameBtn').addEventListener('click', newGame);
document.getElementById('restartBtn').addEventListener('click', newGame);

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}

canvas.addEventListener('mousedown', onDragStart);
canvas.addEventListener('touchstart', onDragStart, { passive: false });
window.addEventListener('mousemove', onDragMove);
window.addEventListener('touchmove', onDragMove, { passive: false });
window.addEventListener('mouseup', onDragEnd);
window.addEventListener('touchend', onDragEnd);

function onDragStart(e) {
  if (ball.moving || gameOver) return;
  const p = pointerPos(e);
  const d = Math.hypot(p.x - ball.x, p.y - ball.y);
  if (d < 60) {
    dragging = true;
    dragCurrent = p;
    e.preventDefault();
  }
}

function onDragMove(e) {
  if (!dragging) return;
  dragCurrent = pointerPos(e);
  e.preventDefault();
}

function onDragEnd() {
  if (!dragging) return;
  dragging = false;
  const dx = ball.x - dragCurrent.x;
  const dy = ball.y - dragCurrent.y;
  let pullX = dx, pullY = dy;
  const pullDist = Math.hypot(pullX, pullY);
  if (pullDist < 8) { dragCurrent = null; return; }
  const clamped = Math.min(pullDist, MAX_PULL);
  const scale = clamped / pullDist;
  pullX *= scale; pullY *= scale;

  ball.vx = pullX * POWER_SCALE;
  ball.vy = pullY * POWER_SCALE;
  ball.moving = true;
  dragCurrent = null;
}

function activeShooter() { return turn === 'p1' ? p1 : p2; }
function activeTarget() { return turn === 'p1' ? p2 : p1; }

function checkCollisions() {
  const defender = activeTarget();
  const shooter = activeShooter();
  for (const t of defender.targets) {
    if (!t.alive) continue;
    const halfW = t.w / 2, halfH = t.h / 2;
    if (ball.x + BALL_RADIUS > t.x - halfW && ball.x - BALL_RADIUS < t.x + halfW &&
        ball.y + BALL_RADIUS > t.y - halfH && ball.y - BALL_RADIUS < t.y + halfH) {
      t.alive = false;
      shooter.score += t.value;
      (turn === 'p1' ? p1ScoreEl : p2ScoreEl).textContent = shooter.score;
      spawnParticles(t.x, t.y, t.value);
      ball.vx *= 0.6;
      ball.vy *= -0.4;
    }
  }
}

function spawnParticles(x, y, value) {
  particles.push({ x, y, life: 40, text: '+' + value });
}

const mid = () => midY();

function update() {
  if (gameOver) return;
  if (ball.moving) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    if (ball.x - BALL_RADIUS < 0) { ball.x = BALL_RADIUS; ball.vx *= -0.7; }
    if (ball.x + BALL_RADIUS > W) { ball.x = W - BALL_RADIUS; ball.vx *= -0.7; }
    if (ball.y - BALL_RADIUS < HUD_HEIGHT) { ball.y = HUD_HEIGHT + BALL_RADIUS; ball.vy *= -0.7; }
    if (ball.y + BALL_RADIUS > H) { ball.y = H - BALL_RADIUS; ball.vy *= -0.7; }

    checkCollisions();

    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed < 0.15) {
      ball.moving = false;
      finishTurn();
    }
  }

  particles.forEach(p => p.life--);
  particles = particles.filter(p => p.life > 0);
}

function finishTurn() {
  activeShooter().turnsUsed++;

  const p1Cleared = p1.targets.every(t => !t.alive);
  const p2Cleared = p2.targets.every(t => !t.alive);
  const turnsExhausted = p1.turnsUsed >= MAX_TURNS_PER_SIDE && p2.turnsUsed >= MAX_TURNS_PER_SIDE;

  if (p1Cleared || p2Cleared || turnsExhausted) {
    gameOver = true;
    let winner;
    if (p1.score === p2.score) winner = "It's a draw";
    else winner = p1.score > p2.score ? "P1 wins!" : "P2 wins!";
    bannerText.textContent = `${winner} (P1: ${p1.score} — P2: ${p2.score})`;
    banner.style.display = 'block';
    return;
  }

  turn = turn === 'p1' ? 'p2' : 'p1';
  updateTurnIndicator();
  resetBall();
}

function drawFloorLines() {
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let y = HUD_HEIGHT; y < H; y += 32) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  // midline separating the two sides
  ctx.strokeStyle = 'rgba(47,111,237,0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(0, mid());
  ctx.lineTo(W, mid());
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTarget(t) {
  if (!t.alive) return;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.fillStyle = '#d9d3c4';
  ctx.strokeStyle = '#8a8371';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(-t.w/2, -t.h/2, t.w, t.h);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1c3fa8';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(t.name, 0, -8);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(t.value, 0, 18);
  ctx.restore();
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = '#f2f2f2';
  ctx.fill();
  ctx.strokeStyle = '#999';
  ctx.stroke();
}

function drawAimLine() {
  if (!dragging || !dragCurrent) return;
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#2f6fed';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  const dx = ball.x - dragCurrent.x;
  const dy = ball.y - dragCurrent.y;
  ctx.lineTo(ball.x + dx, ball.y + dy);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = '#1c8a3c';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - (40 - p.life));
    ctx.globalAlpha = 1;
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawFloorLines();
  p1.targets.forEach(drawTarget);
  p2.targets.forEach(drawTarget);
  drawAimLine();
  drawBall();
  drawParticles();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
